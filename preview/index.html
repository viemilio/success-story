a2`,1200),duration:14,captions:[{t:0,text:`Die E-Mail kam an einem Donnerstag, 7:42 Uhr.`},{t:3.2,text:`Achtzehn Monate. Oder wir machen zu.`},{t:6.4,text:`Mein Vater stand 38 Jahre an Linie 3.`},{t:9.6,text:`Ich wollte nicht die sein, die hier das Licht ausmacht.`}]},{id:`kemal`,name:`Kemal Aydın`,role:`Schichtmeister, 27 Jahre im Werk`,topic:`Wie es ist, die eigene Linie neu zu bauen`,poster:Pf(`photo-1500648767791-00dcc994a43e`,1200),duration:12,captions:[{t:0,text:`Früher kamen die Pläne fertig aus der Zentrale.`},{t:3.4,text:`Diesmal saßen wir am digitalen Zwilling und haben selbst geplant.`},{t:7.6,text:`Zum ersten Mal hat uns jemand gefragt, wie wir arbeiten wollen.`}]},{id:`lea`,name:`Lea Schuster`,role:`Auszubildende Mechatronik`,topic:`Die Generation, die im Zwilling lernt`,poster:Pf(`photo-1494790108377-be9c29b29330`,1200),duration:11,captions:[{t:0,text:`Ich habe meine Linie gebaut, bevor ich sie anfassen durfte.`},{t:4,text:`Im Simulator darf man Fehler machen.`},{t:7,text:`In der Halle macht man sie dann nicht mehr.`}]},{id:`sophie`,name:`Sophie Nguyen`,role:`Managerin, MHP`,topic:`Warum wir drei Monate in der Kantine gegessen haben`,poster:Pf(`photo-1438761681033-6461ffad8d80`,1200),duration:12,captions:[{t:0,text:`Wir haben nicht aus dem Projektraum heraus beraten.`},{t:3.6,text:`Wir standen in der Halle, in jeder Schicht.`},{t:7.4,text:`Irgendwann waren wir keine Berater mehr, sondern Kollegen.`}]},{id:`markus`,name:`Dr. Markus Hallberg`,role:`CEO, HALLBERG Antriebstechnik`,topic:`Was Aalen für alle elf Werke bedeutet`,poster:Pf(`photo-1560250097-0b93528c311a`,1200),duration:12,captions:[{t:0,text:`Aalen sollte unser Problemwerk sein.`},{t:3.4,text:`Heute ist es unser Leitwerk.`},{t:6.4,text:`Was hier entstanden ist, rollen wir in allen elf Werken aus.`}]}],Lf={dropcap:`E`,paragraphs:[`Es gibt Werke, deren Zukunft in Tabellen entschieden wird. Aalen war so ein Werk: 71 Jahre alt, 2.400 Beschäftigte, ein Produkt, dessen Ende absehbar war. Getriebe für Verbrenner. Im März 2024 setzte der Konzernvorstand eine Frist. 18 Monate, dann wird entschieden.`,`Was dann passierte, steht in keinem Lehrbuch. Jana Brenner legte keinen Sparplan vor, sondern einen Umbauplan. Zusammen mit MHP ließ sie das gesamte Werk als digitalen Zwilling entstehen, bevor eine einzige Maschine bewegt wurde. Und sie gab den Stift an die, die das Werk am besten kennen: die Belegschaft.`]},Rf=[{no:`01`,title:`Simulation vor Stahl`,text:`11.000 Szenarien im digitalen Zwilling, bevor die erste Schraube gelöst wurde. Umgebaut wurde nur, was virtuell bewiesen war.`,image:`data:image/webp;base64,UklGRswUAQBXRUJQVlA4IMAUAQAQkQOdASo4BeIAPj0aikQiIaEUKk5wIAPEsjZPR2pgZBhnaj+r/Tj6z/Hfuz/kv2q+Sfjvrb9m/bv8h/1/8R8tX8Tnm91/4nlDeuf1vzn/Lj/U//P/Xf6X4VfoX/3/6L9//+79if6vf9v/A/6H4Kf9v9xPfP/cv/B6r/67/x/3O/9fw4f9390/gB/e/U5/tX/Q////S7YL0R/N1/9v7vf/n5hP6t/2P3X/5/vSf/7s/OdXiT+bfzffb5dfh/8L/ov+H/h/24+539vy7/A/5n/i9D/5/+ZP3v+U/db/Bfvd9Cf+Lxr/O/4//uf578kvkR/Jv6B/of7/+4/+I/fD64+8H+m8xzePyw9jL3O+/f8X/Gflr8HP4f7Y+0H7L/r//F/oPgH/of90/6X+L9wf+1443ov7bfAR/Zf9H+1Xu5f6f/2/3X/A/eP3efWX/t/1vwEfz/+7/9r/H/lp89H/7/6fww/eL//+7f+3n///7J3aRnLCyGUGJ5ypMjAALF9gv9HMgW40uWaGX8OPaborC2M559gPv8TI/PZ8+I43D3WyG5d8rPssqkgffutswzWF7PBD2mrHiY72RL9FLd13p7PteJ+8OlKV3jpyfvEw2eOiSdk9NvT/DlnrDwB7E9JfvNtzOOisoX+EODf5xUxd+fMdA+LtHuaZQeybSY6P/SmoaaWZfGU09AJrs2c9wZxBhyXdSP9ZcXOrR35Xgv6N0GKughR8IymOoj/s7/OAGRsaFKTQhOA9z54W4Iqqf8dMTP1fQI6rdruIUVWUS1lmaa/pPdoZhXVvJo1bknMB9FX9TozXyWkD4Qj48CsSGwKifVOHo63LbgySEcLUJ2yky2ZJVBIm0Checzbvbh08qnrKgTHMmaXXANQ9kNuSdJ60hu4pWmRbr2vRlsTUM3d0aSXKuHKwVRC+rq0cGwSaNvtbQnmGS/jZevN0pyCznyb6AlDOQfuq6KbtXH5RnlEWdkZkQ5zUnN9X/4tKMw/xFXyVgDal9z7lpFD4j+9QZeWoCB+suHNv095pgopPrakN5bWrL9GIbeVQNHgDtdm+rm/SO5GqUu6i5HqTjxqd4KYgAsZCjeVYuYl0IbXRLRHo4HSlNRoqPdoegpbCrXNGNIVhnqgPX7w3FFcvO2xrbszpubNqVlqR1VUNFIDZ0BhnD+CFTZUcy6gcmklLK2Co1MSPpWSKvNgLdFovLJ/OYvv9U9nvuH4MqjQbhHNydYmrasfVsmZTaIm1K/qk3zgvRLylzDZxQXVxR6I5azKu29+P+LKDFv+aqDxq4oysNnoeMqfk2nHnos2Omk5j7AAEj/QSLAyQGgPPsYPE2MbRE46/ut9109u2gWgjtN
